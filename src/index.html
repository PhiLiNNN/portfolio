<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Philipp Wendschuch – Full-Stack Developer aus Leipzig</title>
    <meta
      name="description"
      content="Philipp Wendschuch, Full-Stack Developer aus Leipzig. Angular und TypeScript im Frontend, Python im Backend. Mitgründer von Webwerk Leipzig und traudel.app."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e2530" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#dfe6ef" media="(prefers-color-scheme: light)" />

    <meta property="og:title" content="Philipp Wendschuch – Full-Stack Developer aus Leipzig" />
    <meta
      property="og:description"
      content="Portfolio von Philipp Wendschuch, Full-Stack Developer aus Leipzig."
    />
    <meta property="og:type" content="website" />

    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="author" href="humans.txt" />
    <!-- Fonts (Syne, Overpass) are self-hosted via @font-face in styles.scss.
         No Google Fonts CDN: avoids transferring visitor IPs to Google (GDPR). -->

      rel="preload"
      as="font"
      type="font/woff2"
      href="assets/fonts/syne/syne-v22-latin-800.woff2"

    />

      rel="preload"
      as="font"

      href="assets/fonts/overpass/overpass-v13-latin-regular.woff2"
      crossorigin
    />

      defer

      data-website-id="b2723338-b571-4cd2-b6c4-53502abba6b9"
    ></script>
