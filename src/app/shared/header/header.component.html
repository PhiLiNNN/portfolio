<header class="bar">
  <div class="wrap bar-inner">
    <a class="logo" href="/" (click)="go($event, 'home')" [attr.aria-label]="'a11y.backToHome' | translate"><span aria-hidden="true">PW</span></a>

    <nav class="nav" aria-label="Hauptnavigation">
      @for (item of primary; track item.id) {
      <a
        [href]="'/#' + item.id"
        (click)="go($event, item.id)"
        [attr.aria-current]="active() === item.id ? 'true' : null"
        >{{ item.key | translate }}</a
      >
      }
    </nav>

    <div class="controls">
      <div class="switch-row">
        <span aria-hidden="true">☀</span>
        <button
          type="button"
          class="switch"
          role="switch"
          [attr.aria-checked]="theme.theme() === 'dark'"
          [attr.aria-label]="(theme.theme() === 'dark' ? 'a11y.themeLight' : 'a11y.themeDark') | translate"
          (click)="toggleTheme()"
        ></button>
        <span aria-hidden="true">☾</span>
      </div>
      <div class="switch-row">
        <span aria-hidden="true">DE</span>
        <button
          type="button"
          class="switch"
          role="switch"
          [attr.aria-checked]="lang() === 'en'"
          [attr.aria-label]="'a11y.langToggle' | translate"
          (click)="toggleLang()"
        ></button>
        <span aria-hidden="true">EN</span>
      </div>
      <button
        #burger
        type="button"
        class="btn btn-icon burger"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="overlay-menu"
        [attr.aria-label]="(menuOpen() ? 'a11y.closeMenu' : 'a11y.openMenu') | translate"
        (click)="toggleMenu()"
      >
        @if (menuOpen()) {
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        }
      </button>
    </div>
  </div>
</header>

<div
  #overlay
  id="overlay-menu"
  class="overlay"
  [class.open]="menuOpen()"
  role="dialog"
  aria-modal="true"
  [attr.aria-hidden]="!menuOpen()"
  [attr.inert]="menuOpen() ? null : ''"
>
  <nav class="overlay-nav wrap" aria-label="Menü">
    @for (item of all; track item.id) {
    <a
      [href]="'/#' + item.id"
      (click)="go($event, item.id)"
      [attr.aria-current]="active() === item.id ? 'true' : null"
      >{{ item.key | translate }}</a
    >
    }
    <div class="overlay-controls">
      <button type="button" class="btn" (click)="toggleTheme()">
        {{ (theme.theme() === 'dark' ? 'a11y.themeLight' : 'a11y.themeDark') | translate }}
      </button>
      <button type="button" class="btn" (click)="toggleLang()">
        {{ lang() === 'en' ? 'Deutsch' : 'English' }}
      </button>
    </div>
  </nav>
</div>
