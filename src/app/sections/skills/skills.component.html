<section id="skills" class="section" aria-labelledby="skills-title">
  <div class="wrap">
    <div class="section-head">
      <h2 id="skills-title" class="t-h2">{{ "skills.title" | translate }}</h2>
      <p>{{ "skills.intro" | translate }}</p>
    </div>
    <div class="grid grid-3">
      @for (group of groups; track group.key) {
      <div class="plate group" appInView>
        <h3 class="t-h3">{{ "skills." + group.key | translate }}</h3>
        <ul>
          @for (skill of group.skills; track skill.name; let i = $index) {
          <li class="fader" [style.--v]="skill.level + '%'" [style.transition-delay]="i * 60 + 'ms'">
            <img [src]="'./assets/img/icons/' + skill.icon + '.svg'" alt="" width="24" height="24" loading="lazy" />
            <span>{{ skill.name }}</span>
            <div class="track" role="img" [attr.aria-label]="skill.name">
              <div class="fill" [style.transition-delay]="i * 60 + 'ms'"></div>
              <div class="knob" [style.transition-delay]="i * 60 + 'ms'"></div>
            </div>
          </li>
          }
        </ul>
      </div>
      }
    </div>
  </div>
</section>
