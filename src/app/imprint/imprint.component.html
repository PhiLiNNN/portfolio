<section class="legal wrap" aria-labelledby="imprint-title">
  <div class="plate">
    <div class="legal-head">
      <h1 id="imprint-title">{{ "imprint.title" | translate }}</h1>
      <a class="btn btn-icon" [routerLink]="['/']" [attr.aria-label]="'a11y.backToHome' | translate">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6" /></svg>
      </a>
    </div>
    <p>
      <strong>{{ "imprint.name" | translate }}</strong><br />
      {{ "imprint.address" | translate }}<br />
      {{ "imprint.city" | translate }}
    </p>
    <h2>{{ "imprint.contact" | translate }}</h2>
    <p>
      {{ "imprint.phone" | translate }}: <a href="tel:+491627849412">0162 78 49 41 2</a><br />
      {{ "imprint.email" | translate }}:
      <a href="mailto:contact@philipp-wendschuch.dev">contact&#64;philipp-wendschuch.dev</a>
    </p>
  </div>
</section>
